<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辦公室飲料集體訂購系統 - Group Drink Order</title>
    
    <!-- 引入華麗的字體 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono&display=swap">
    
    <!-- CDN 加載 React 18, ReactDOM 18, Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 自訂 Tailwind 主題與關鍵樣式配置 -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
              tea: {
                line: '#86efac',
                matcha: '#4ade80',
                brown: '#d97706',
                creamy: '#fef08a'
              }
            },
            fontFamily: {
              sans: ["Outfit", "Noto Sans TC", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"]
            },
            boxShadow: {
              'soft-lg': '0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
              'gold': '0 4px 14px 0 rgba(245, 158, 11, 0.2)',
              'glow': '0 4px 20px 0 rgba(16, 185, 129, 0.15)'
            }
          }
        }
      }
    </script>
    
    <style>
      body {
        font-family: "Outfit", "Noto Sans TC", system-ui, sans-serif;
        background-color: #f8fafc;
        background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }
      
      /* 美化滾動條 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* 點選縮放特效 */
      .scale-hover {
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .scale-hover:hover {
        transform: translateY(-2px);
      }
      .scale-hover:active {
        transform: translateY(1px) scale(0.98);
      }
    </style>
  </head>
  <body class="text-slate-800 antialiased min-h-screen pb-16">

    <!-- React 應用程式掛載點 -->
    <div id="root"></div>

    <!-- 所有的 TypeScript/JavaScript 邏輯、型別定義、OrderForm 元件、OrderList 元件與 App 整合元件全部寫在同一個 script 區塊 -->
    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback } = React;

      // API 後端 網址 
      const API_URL = "https://script.google.com/macros/s/AKfycbzzDaiA9KuQBjPrGAOUlVqrOx_Kl7zNy443IpDwWPgqzf4ITjktSCy2ZZ8GtS-0SrfD/exec";

      // 本地端美味備用菜單 (當 GAS 沒有回傳 menu 時調用，確保系統永遠有美麗的茶單)
      const FALLBACK_MENU = [
        { name: "手作波霸奶茶", price: 55, category: "人氣熱銷", description: "香濃奶茶配上手作太妃黃金珍珠，Q彈有嚼勁，辦公室熱銷首選。" },
        { name: "茉香珍珠綠茶", price: 40, category: "嚴選鮮茶", description: "清新茉莉薰花綠茶，伴隨飽滿白玉珍珠，芳香甘甜、爽口無負擔。" },
        { name: "炭焙四季春", price: 35, category: "嚴選鮮茶", description: "臺灣南投高山四季春青茶，喉韻清香高雅，入喉回甘悠長。" },
        { name: "經典莊園紅茶", price: 35, category: "嚴選鮮茶", description: "嚴選錫蘭莊園紅茶葉，茶湯紅潤飽滿，醇厚回甘帶淡淡果香。" },
        { name: "小農重乳烏龍拿鐵", price: 60, category: "小農鮮乳", description: "深焙鐵觀音烏龍配上小農牧場醇鮮乳，乳香濃郁與茶焙香在口中完美交融。" },
        { name: "伯爵紅茶拿鐵", price: 60, category: "小農鮮乳", description: "佛手柑佛香優雅伯爵紅茶搭配香濃鮮乳，佛手柑清香獨特療癒。" },
        { name: "鮮百香雙響炮", price: 65, category: "鮮果特調", description: "埔里鮮百香果原汁入茶，大方鋪滿椰果與珍珠，雙重Q彈爽脆嚼感。" },
        { name: "手搾葡萄柚綠茶", price: 65, category: "鮮果特調", description: "手剝滿滿紅肉柚子果粒，清甜綠茶茶底微潤，酸甜微苦茶香爽快。" },
        { name: "古法翡翠冬瓜檸檬", price: 55, category: "在地經典", description: "古法慢火手炒黑糖冬瓜蜜，調配屏東現榨檸檬汁，酸香生津，消暑神品。" },
        { name: "椰果鮮芒果青茶", price: 60, category: "鮮果特調", description: "夏季香甜芒果原汁與鮮爽青茶，搭配多汁Q嫩脆椰果，熱帶水果風情。" }
      ];

      // Toppings 附加配料庫（增加豐富度與實用性）
      const TOPPINGS = [
        { name: "黃金珍珠", price: 5 },
        { name: "清脆椰果", price: 5 },
        { name: "嫩仙草凍", price: 5 },
        { name: "原味布丁", price: 10 }
      ];

      // 甜度選項
      const SUGAR_OPTIONS = [
        { label: "正常糖", desc: "10分糖" },
        { label: "少糖", desc: "7分糖" },
        { label: "半糖", desc: "5分糖" },
        { label: "微糖", desc: "3分糖" },
        { label: "無糖", desc: "0分糖" }
      ];

      // 冰塊選項
      const ICE_OPTIONS = [
        { label: "正常冰", desc: "標準" },
        { label: "少冰", desc: "7分冰" },
        { label: "微冰", desc: "3分冰" },
        { label: "去冰", desc: "冷(無冰)" },
        { label: "溫熱", desc: "50℃ (暖)" }
      ];

      // SVG 向量圖標庫
      const Icons = {
        Coffee: () => (
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l-.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
        ),
        Cup: ({ className = "w-6 h-6" }) => (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-3-4 3v-4H6a2 2 0 01-2-2V10a2 2 0 012-2h2m9-3h-9" fill="currentColor" fillOpacity="0.1"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 2l2 4M9 3l1.5 3M15 3.5l-1 2.5" />
          </svg>
        ),
        Plus: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
            <polyline points="12 5 12 19"></polyline>
            <polyline points="5 12 19 12"></polyline>
          </svg>
        ),
        Minus: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
            <polyline points="5 12 19 12"></polyline>
          </svg>
        ),
        Trash: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
          </svg>
        ),
        Edit: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        ),
        Loader: ({ className = "w-5 h-5 animate-spin" }) => (
          <svg className={className} fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        ),
        Refresh: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M21 20v-5h-.581m-15.356-2A8.001 8.001 0 112.79 16.11" />
          </svg>
        ),
        AlertCircle: () => (
          <svg className="w-12 h-12 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        ),
        Copy: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
          </svg>
        ),
        Check: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        ),
        LocalUser: () => (
          <svg className="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        ),
        Search: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        )
      };

      // --- Toast 提醒訊息元件 ---
      function toastMessage(message, type = "success", duration = 3000) {
        // 交給 App 控制
      }

      // ==========================================
      // OrderForm 元件 - 填單與修改表單
      // ==========================================
      function OrderForm({ formState, setFormState, isEditing, onCancelEdit, onSubmit, isSubmitting, lastOrderName }) {
        const { name, drink, price, category, sugar, ice, quantity, toppings } = formState;

        // 計算目前選擇配料之總額
        const toppingsPrice = toppings.reduce((acc, t_name) => {
          const matched = TOPPINGS.find(t => t.name === t_name);
          return acc + (matched ? matched.price : 0);
        }, 0);

        // 動態計算目前這杯飲料的單杯單價與總額
        const singlePrice = price + toppingsPrice;
        const totalPrice = singlePrice * quantity;

        // 甜度點擊
        const handleSugarClick = (sugarLabel) => {
          setFormState(prev => ({ ...prev, sugar: sugarLabel }));
        };

        // 冰塊點擊
        const handleIceClick = (iceLabel) => {
          setFormState(prev => ({ ...prev, ice: iceLabel }));
        };

        // 配料點選切換
        const handleToppingToggle = (toppingName) => {
          setFormState(prev => {
            const exists = prev.toppings.includes(toppingName);
            const newToppings = exists
              ? prev.toppings.filter(t => t !== toppingName)
              : [...prev.toppings, toppingName];
            return { ...prev, toppings: newToppings };
          });
        };

        // 修改數量
        const handleQuantityChange = (change) => {
          const nextVal = quantity + change;
          if (nextVal >= 1 && nextVal <= 99) {
            setFormState(prev => ({ ...prev, quantity: nextVal }));
          }
        };

        // 按下「代入上次姓名」的快捷按鍵
        const applyLastUsedName = () => {
          if (lastOrderName) {
            setFormState(prev => ({ ...prev, name: lastOrderName }));
          }
        };

        // 送出表單
        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.toString().trim()) {
            alert("請填寫訂購人姓名！");
            return;
          }
          if (!drink) {
            alert("請先從菜單中選擇一款飲料！");
            return;
          }
          
          // 整合附加配料後的飲料名稱送出給 GAS
          let finalDrinkName = drink;
          if (toppings.length > 0) {
            finalDrinkName += ` [加 ${toppings.join(", ")}]`;
          }

          onSubmit({
            name: name.toString().trim(),
            drink: finalDrinkName,
            sugar,
            ice,
            quantity,
            totalPrice
          });
        };

        return (
          <div id="order-form-container" className={`bg-white rounded-2xl border transition-all duration-300 p-6 ${isEditing ? 'border-amber-400 shadow-[0_4px_24px_rgba(245,158,11,0.12)]' : 'border-slate-100 shadow-soft-lg'}`}>
            <div className="flex items-center justify-between mb-5">
              <h2 className="text-xl font-bold font-sans flex items-center gap-2">
                {isEditing ? (
                  <>
                    <span className="flex h-3 w-3 relative">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                    </span>
                    <span className="text-amber-800">修改訂單明細</span>
                  </>
                ) : (
                  <>
                    <span className="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
                    <span className="text-slate-800">建立飲料訂單</span>
                  </>
                )}
              </h2>
              {isEditing && (
                <button 
                  onClick={onCancelEdit}
                  className="text-xs text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg font-medium transition"
                >
                  取消重置
                </button>
              )}
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              
              {/* 訂購人 */}
              <div>
                <div className="flex justify-between items-center mb-1.5">
                  <label className="text-sm font-semibold text-slate-700 flex items-center gap-1">
                    👤 訂購人姓名 <span className="text-rose-500 text-xs">*</span>
                  </label>
                  {lastOrderName && name !== lastOrderName && (
                    <button
                      type="button"
                      onClick={applyLastUsedName}
                      className="text-xs text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100/80 px-2 py-0.5 rounded transition flex items-center gap-1"
                    >
                      <Icons.LocalUser /> 代入最近使用的「{lastOrderName}」
                    </button>
                  )}
                </div>
                <input
                  type="text"
                  required
                  placeholder="請輸入您的真實大名或暱稱"
                  value={name}
                  onChange={(e) => setFormState(prev => ({ ...prev, name: e.target.value }))}
                  className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-500 transition font-sans text-sm bg-slate-50/50"
                />
              </div>

              {/* 選擇的飲料 */}
              <div>
                <label className="block text-sm font-semibold text-slate-700 mb-1.5">
                  🥤 選擇的飲品
                </label>
                {drink ? (
                  <div className="bg-emerald-50/50 border border-emerald-100 rounded-xl p-3 flex justify-between items-center transition duration-200">
                    <div className="flex-1 min-w-0 pr-2">
                      <p className="text-sm font-bold text-emerald-900 truncate">{drink}</p>
                      <p className="text-xs text-emerald-600 font-medium">{category || "經典飲品"}</p>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-500 font-mono">底價</span>
                      <p className="text-sm font-bold text-emerald-800 font-mono">${price}</p>
                    </div>
                  </div>
                ) : (
                  <div className="border border-dashed border-slate-200 rounded-xl p-4 text-center cursor-default bg-slate-50 transition hover:bg-slate-100/50" onClick={() => {
                    document.getElementById('menu-section').scrollIntoView({ behavior: 'smooth' });
                  }}>
                    <p className="text-xs text-slate-400">👈 請點選右側菜單選擇您想喝的飲料</p>
                    <span className="text-[10px] text-emerald-600 font-medium inline-block mt-1 bg-emerald-50 px-2 py-0.5 rounded hover:bg-emerald-100 transition">快速跳轉至菜單 ➔</span>
                  </div>
                )}
              </div>

              {/* 追加配料 (加料) */}
              {drink && (
                <div>
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="text-sm font-semibold text-slate-700">
                      ✨ 加料區 (可多選)
                    </label>
                    <span className="text-[10px] text-slate-400">適量加料風味更佳</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    {TOPPINGS.map((t) => {
                      const isSelected = toppings.includes(t.name);
                      return (
                        <button
                          key={t.name}
                          type="button"
                          onClick={() => handleToppingToggle(t.name)}
                          className={`flex justify-between items-center px-3 py-2 rounded-xl text-xs font-medium border transition-all scale-hover ${
                            isSelected 
                              ? 'bg-brand-50 border-brand-500 text-brand-800 shadow-[0_2px_8px_rgba(16,185,129,0.08)]' 
                              : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                          }`}
                        >
                          <span>{t.name}</span>
                          <span className={`font-mono px-1.5 py-0.5 rounded-md ${isSelected ? 'bg-emerald-200 text-emerald-900' : 'bg-slate-100 text-slate-500'}`}>
                            +${t.price}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 選擇甜度 */}
              <div>
                <label className="block text-sm font-semibold text-slate-700 mb-1.5">
                  🍯 選擇甜度
                </label>
                <div className="grid grid-cols-5 gap-1 bg-slate-100/80 p-1 rounded-xl">
                  {SUGAR_OPTIONS.map((opt) => {
                    const isSelected = sugar === opt.label;
                    return (
                      <button
                        key={opt.label}
                        type="button"
                        onClick={() => handleSugarClick(opt.label)}
                        className={`py-2 rounded-lg text-center transition flex flex-col justify-center items-center ${
                          isSelected
                            ? 'bg-brand-600 text-white shadow-soft-lg font-bold'
                            : 'hover:bg-white text-slate-600'
                        }`}
                      >
                        <span className="text-xs">{opt.label}</span>
                        <span className={`text-[9px] ${isSelected ? 'text-emerald-100' : 'text-slate-400'} font-mono`}>{opt.desc}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 選擇冰量 */}
              <div>
                <label className="block text-sm font-semibold text-slate-700 mb-1.5">
                  ❄️ 選擇冰塊
                </label>
                <div className="grid grid-cols-5 gap-1 bg-slate-100/80 p-1 rounded-xl">
                  {ICE_OPTIONS.map((opt) => {
                    const isSelected = ice === opt.label;
                    return (
                      <button
                        key={opt.label}
                        type="button"
                        onClick={() => handleIceClick(opt.label)}
                        className={`py-2 rounded-lg text-center transition flex flex-col justify-center items-center ${
                          isSelected
                            ? 'bg-brand-600 text-white shadow-soft-lg font-bold'
                            : 'hover:bg-white text-slate-600'
                        }`}
                      >
                        <span className="text-xs">{opt.label}</span>
                        <span className={`text-[9px] ${isSelected ? 'text-emerald-100' : 'text-slate-400'} font-mono`}>{opt.desc}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 數量 */}
              <div className="flex items-center justify-between py-2 border-t border-b border-slate-100">
                <span className="text-sm font-semibold text-slate-700">📦 訂購數量</span>
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    disabled={quantity <= 1}
                    onClick={() => handleQuantityChange(-1)}
                    className="w-8 h-8 rounded-full border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-600 transition active:scale-95 disabled:opacity-40"
                  >
                    <Icons.Minus />
                  </button>
                  <span className="w-12 text-center text-base font-bold font-mono">{quantity}</span>
                  <button
                    type="button"
                    onClick={() => handleQuantityChange(1)}
                    className="w-8 h-8 rounded-full border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-600 transition active:scale-95"
                  >
                    <Icons.Plus />
                  </button>
                </div>
              </div>

              {/* 結算小票收據 */}
              {drink && (
                <div className="bg-slate-50 border border-slate-100 rounded-2xl p-4 font-sans text-xs text-slate-600 space-y-2 relative overflow-hidden">
                  <div className="absolute right-2 top-2 opacity-[0.03] text-teal-900 pointer-events-none">
                    <Icons.Cup className="w-20 h-20" />
                  </div>
                  <div className="flex justify-between">
                    <span>單杯基礎零售價:</span>
                    <span className="font-mono">${price}</span>
                  </div>
                  {toppings.length > 0 && (
                    <div className="flex justify-between text-emerald-700">
                      <span>加料合計 ({toppings.join(", ")}):</span>
                      <span className="font-mono">+${toppingsPrice}</span>
                    </div>
                  )}
                  <div className="flex justify-between">
                    <span>單杯合計單價:</span>
                    <span className="font-mono">${singlePrice}</span>
                  </div>
                  <div className="flex justify-between pb-2 border-b border-dashed border-slate-200">
                    <span>購買數量:</span>
                    <span className="font-mono">x {quantity}</span>
                  </div>
                  <div className="flex justify-between items-center pt-1">
                    <span className="text-sm font-bold text-slate-800">應付總金額 :</span>
                    <span className="text-lg font-bold text-emerald-600 font-mono">${totalPrice}</span>
                  </div>
                </div>
              )}

              {/* 送出與提交 */}
              <button
                type="submit"
                disabled={!drink || isSubmitting}
                className={`w-full py-3.5 rounded-xl text-white font-semibold transition-all scale-hover flex items-center justify-center gap-2 ${
                  !drink
                    ? 'bg-slate-300 pointer-events-none text-slate-400 cursor-not-allowed'
                    : isSubmitting
                    ? 'bg-emerald-700/80 cursor-wait'
                    : isEditing
                    ? 'bg-amber-500 hover:bg-amber-600 shadow-gold'
                    : 'bg-brand-600 hover:bg-brand-700 shadow-glow'
                }`}
              >
                {isSubmitting ? (
                  <>
                    <Icons.Loader className="w-5 h-5 text-white animate-spin" />
                    <span>排隊傳送訂單中...</span>
                  </>
                ) : isEditing ? (
                  <>
                    <Icons.Edit />
                    <span>確認修改我的飲料 ➔</span>
                  </>
                ) : (
                  <>
                    <Icons.Plus />
                    <span>加入美味訂單行程 ➔</span>
                  </>
                )}
              </button>

            </form>
          </div>
        );
      }

      // ==========================================
      // OrderList 元件 - 精美的當日訂單列表
      // ==========================================
      function OrderList({ orders, onEdit, onDelete, activeUser, onFilterMyOrders, isFilteringMy, currentFilterUser }) {
        const [searchQuery, setSearchQuery] = useState("");

        // 整理/過濾訂單明細
        const filteredOrders = useMemo(() => {
          let list = orders;
          
          if (isFilteringMy && currentFilterUser) {
            list = list.filter(o => o.name.toLowerCase() === currentFilterUser.toLowerCase());
          }

          if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase().trim();
            list = list.filter(o => 
              o.name.toLowerCase().includes(query) || 
              o.drink.toLowerCase().includes(query) || 
              o.sugar.toLowerCase().includes(query) || 
              o.ice.toLowerCase().includes(query)
            );
          }

          return list;
        }, [orders, searchQuery, isFilteringMy, currentFilterUser]);

        // 計算統計資訊
        const stats = useMemo(() => {
          const totalCups = orders.reduce((sum, o) => sum + o.quantity, 0);
          const totalPrice = orders.reduce((sum, o) => sum + o.totalPrice, 0);
          const uniquePeople = new Set(orders.map(o => o.name)).size;
          
          return { totalCups, totalPrice, uniquePeople };
        }, [orders]);

        // 統計飲料聚類，便於電話訂購（超好用的彙整功能！）
        const aggregatedText = useMemo(() => {
          const summary = {};
          orders.forEach(o => {
            const key = `${o.drink} [${o.sugar}/${o.ice}]`;
            summary[key] = (summary[key] || 0) + o.quantity;
          });

          let textOutput = `🥤【今日團購飲料統計清單】🥛\n`;
          textOutput += `日期: ${new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' })}\n`;
          textOutput += `總計: ${orders.length} 筆項目，合計 ${stats.totalCups} 杯，共 $${stats.totalPrice} 元\n`;
          textOutput += `-----------------------\n`;
          Object.entries(summary).forEach(([drinkKey, qty], i) => {
            textOutput += `${i + 1}. ${drinkKey} ─── x ${qty} 杯\n`;
          });
          textOutput += `-----------------------\n`;
          textOutput += `訂購大名: ${Array.from(new Set(orders.map(o => o.name))).join(', ')}\n`;
          textOutput += `本統計產自辦公室飲料管理系統`;
          return textOutput;
        }, [orders, stats]);

        // 複製統計內容
        const [copied, setCopied] = useState(false);
        const handleCopyStats = () => {
          if (orders.length === 0) return;
          navigator.clipboard.writeText(aggregatedText)
            .then(() => {
              setCopied(true);
              setTimeout(() => setCopied(false), 2000);
            })
            .catch(err => {
              alert("複製失敗，請嘗試手動選取複製");
            });
        };

        return (
          <div className="bg-white rounded-2xl border border-slate-100 shadow-soft-lg p-6 space-y-6">
            
            {/* 今日點單摘要 */}
            <div className="bg-slate-50/70 border border-slate-100 rounded-2xl p-4 grid grid-cols-3 gap-2">
              <div className="text-center py-1">
                <span className="text-[10px] text-slate-500 block mb-0.5">點單人數</span>
                <span className="text-lg font-bold text-slate-700 font-sans">{stats.uniquePeople}</span>
                <span className="text-[9px] text-slate-400 block font-sans">人已上車</span>
              </div>
              <div className="text-center py-1 border-l border-r border-slate-200/60">
                <span className="text-[10px] text-slate-500 block mb-0.5">今日杯數</span>
                <span className="text-lg font-bold text-emerald-600 font-sans">{stats.totalCups}</span>
                <span className="text-[9px] text-slate-400 block font-sans">總杯數</span>
              </div>
              <div className="text-center py-1">
                <span className="text-[10px] text-slate-500 block mb-0.5">累計金額</span>
                <span className="text-lg font-bold text-emerald-600 font-sans font-mono">${stats.totalPrice}</span>
                <span className="text-[9px] text-slate-400 block font-sans">台幣(NTD)</span>
              </div>
            </div>

            {/* 搜尋過濾與本我切換 */}
            <div className="space-y-3">
              <div className="flex flex-col sm:flex-row gap-2 justify-between items-stretch sm:items-center">
                <h3 className="text-md font-bold text-slate-800 flex items-center gap-1.5">
                  📋 今日已投杯單 ({orders.length} 筆)
                </h3>
                
                {/* 我的訂單 / 全部 切換按鍵 */}
                {currentFilterUser && (
                  <div className="flex rounded-lg bg-slate-100/80 p-0.5 font-sans">
                    <button
                      onClick={() => onFilterMyOrders(false)}
                      className={`px-2.5 py-1 text-xs rounded-md font-medium transition ${
                        !isFilteringMy ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'
                      }`}
                    >
                      看全部人
                    </button>
                    <button
                      onClick={() => onFilterMyOrders(true)}
                      className={`px-2.5 py-1 text-xs rounded-md font-medium transition flex items-center gap-1 ${
                        isFilteringMy ? 'bg-white text-emerald-700 shadow-sm font-bold' : 'text-slate-500 hover:text-slate-700'
                      }`}
                    >
                      <span className="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
                      我的 ({currentFilterUser})
                    </button>
                  </div>
                )}
              </div>

              {/* 搜尋輸入 */}
              <div className="relative">
                <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                  <Icons.Search />
                </span>
                <input
                  type="text"
                  placeholder="搜尋今日成員大名、飲料名稱或甜度冰塊..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-500 text-xs text-slate-600 font-sans transition bg-slate-50/50"
                />
              </div>
            </div>

            {/* 訂單明細內容 */}
            {filteredOrders.length === 0 ? (
              <div className="border border-dashed border-slate-200 rounded-3xl py-12 px-6 text-center bg-slate-50/50 relative overflow-hidden transition-all duration-300">
                <div className="absolute right-0 top-0 w-32 h-32 text-indigo-50/40 select-none pointer-events-none">
                  <Icons.Cup className="w-full h-full stroke-1" />
                </div>
                <Icons.AlertCircle />
                <h4 className="text-sm font-bold text-slate-600 mb-1">
                  {orders.length === 0 ? "目前還沒有任何人點單喔！" : "找不到符合關鍵字的點單項目"}
                </h4>
                <p className="text-xs text-slate-400 max-w-xs mx-auto mb-5 leading-normal">
                  {orders.length === 0 
                    ? "今天辦公室的人員還在打瞌睡嗎？趕快填寫左側表單，成為今天的第一位全辦公室飲料教主吧！" 
                    : "可以嘗試精簡縮短您的搜尋詞，例如輸入「紅」、「無糖」等等喔。"}
                </p>
                {orders.length === 0 && (
                  <div className="animate-bounce">
                    <button 
                      onClick={() => {
                        const target = document.getElementById('order-form-container');
                        if (target) target.scrollIntoView({ behavior: 'smooth' });
                      }}
                      className="px-4 py-2 bg-emerald-500 text-white text-xs font-bold rounded-full hover:bg-emerald-600 transition shadow-glow flex items-center gap-1 mx-auto scale-hover"
                    >
                      👉 馬上點今天第一杯！
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-3.5 max-h-[500px] overflow-y-auto pr-1">
                {filteredOrders.map((order) => {
                  const isOwn = currentFilterUser && order.name.toLowerCase() === currentFilterUser.toLowerCase();
                  return (
                    <div 
                      key={order.orderId}
                      className={`border p-4 rounded-2xl transition duration-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden scale-hover ${
                        isOwn 
                          ? 'border-emerald-300 bg-emerald-50/30 shadow-sm' 
                          : 'border-slate-100 hover:border-slate-200 bg-white'
                      }`}
                    >
                      {/* 上半部：名字與飲料描述 */}
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                          <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${
                            isOwn 
                              ? 'bg-emerald-600 text-white' 
                              : 'bg-slate-100 text-slate-700'

                            {order.name}
                          </span>
                          {isOwn && (
                            <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.2 rounded font-sans">
                              我的點單
                            </span>
                          )}
                          <span className="text-[10px] text-slate-400 font-mono">
                            {order.timestamp ? new Date(order.timestamp).toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' }) : "剛才"}

                        </div>
                        <h4 className="text-sm font-bold text-slate-900 truncate flex items-center gap-1">

                        {/* 甜度與冰塊 BADGES */}
                        <div className="flex items-center gap-1.5 mt-2 flex-wrap text-[10px] font-semibold">

                      {/* 下半部：金額與按鈕 */}

            {/* 大神級的一鍵彙整簡訊功能 */}

      }

      // ==========================================
      // App 主程式元件
      // ==========================================
      function App() {
        const [activeTabCategory, setActiveTabCategory] = useState("全部");
        const [menuSearch, setMenuSearch] = useState("");
        
        // 資料狀態
        const [menu, setMenu] = useState([]);
        const [orders, setOrders] = useState([]);
        const [apiLoading, setApiLoading] = useState(true);
        const [apiError, setApiError] = useState(null);

        // 用於控制 OrderForm 狀態與它的編輯模態
        const [editingOrder, setEditingOrder] = useState(null);
        
        // 記憶使用者姓名快捷鍵
        const [lastOrderName, setLastOrderName] = useState(() => {
          return localStorage.getItem("drink_username") || "";
        });

        // 當前我的訂單過濾狀態
        const [isFilteringMy, setIsFilteringMy] = useState(false);

        // 表單狀態
        const [formState, setFormState] = useState({
          name: lastOrderName,
          drink: "",
          price: 0,
          category: "",
          sugar: "半糖",
          ice: "少冰",
          quantity: 1,
          toppings: []
        });

        const [isSubmitting, setIsSubmitting] = useState(false);

        // 自訂與 GAS 同步之訊息通知彈箱
        const [notification, setNotification] = useState(null);
        const showToast = useCallback((msg, type = "success") => {
          setNotification({ msg, type });
          setTimeout(() => {
            setNotification(null);
          }, 4000);
        }, []);

        // 載入資料 API (GET)
        const fetchRemoteData = async (isSilent = false) => {
          if (!isSilent) setApiLoading(true);
          try {
            // 利用 CORS fetch
            const response = await fetch(API_URL);
            if (!response.ok) {
              throw new Error("遠端 Apps Script 網路回應不成功");
            }
            const resData = await response.json();
            
            // 處理 Menu 數據
            if (resData.menu && resData.menu.length > 0) {
              setMenu(resData.menu);
            } else {
              setMenu(FALLBACK_MENU); // 套用備用菜單
            }
            
            // 處理 Orders 數據
            if (resData.orders) {
              setOrders(resData.orders);
            } else {
              setOrders([]);
            }
            setApiError(null);
          } catch (err) {
            console.error("GET 獲取失敗:", err);
            // 發生網路錯誤，本地依然降底線使用豐富菜單
            setMenu(FALLBACK_MENU);
            setApiError("無法連接到 Google 雲端工作表，已為您載入「本地離線菜單」。只要連上市政網路，寫單仍能投遞喔！");
            showToast("⚠️ 目前處於本地備用狀態(GAS未連線)", "warning");
          } finally {
            setApiLoading(false);
          }
        };

        // 元件載入完畢執行 Fetch
        useEffect(() => {
          fetchRemoteData();
        }, []);

        // 提交與發送 POST 給 GAS
        const handleFormSubmit = async (orderData) => {
          setIsSubmitting(true);
          try {
            // 1. 保存姓名到 localStorage 學會記憶大名
            localStorage.setItem("drink_username", orderData.name);
            setLastOrderName(orderData.name);

            let payload;
            if (editingOrder) {
              // 處於 [修改 action]
              payload = {
                action: "update",
                data: {
                  orderId: editingOrder.orderId,
                  name: orderData.name,
                  drink: orderData.drink,
                  sugar: orderData.sugar,
                  ice: orderData.ice,
                  quantity: orderData.quantity,
                  totalPrice: orderData.totalPrice
                }
              };
            } else {
              // 處於 [新增 action]
              payload = {
                action: "create",
                data: {
                  name: orderData.name,
                  drink: orderData.drink,
                  sugar: orderData.sugar,
                  ice: orderData.ice,
                  quantity: orderData.quantity,
                  totalPrice: orderData.totalPrice
                }
              };
            }

            // 發送 POST (利用簡單文字傳遞繞過 CORS preflight)
            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === "success") {
              showToast(editingOrder ? "✨ 您的點單明細修改成功囉！" : "🎉 您的飲料訂單已成功送到雲端！", "success");
              
              // 重置表單 (但保留大名與糖冰，節省下次填單時間，超好用習慣設計)
              setFormState(prev => ({
                ...prev,
                drink: "",
                price: 0,
                category: "",
                quantity: 1,
                toppings: []
              }));
              
              setEditingOrder(null);
              // 即時更替本地最新
              await fetchRemoteData(true);
            } else {
              throw new Error(result.message || "GAS 後端操作失敗");
            }
          } catch (err) {
            console.error("提交訂訂單失敗:", err);
            showToast(`❌ 送單失敗: ${err.message || '網路離線'}`, "error");
            
            // 離線遊樂場模擬成功 (當無法連接 API，為了給雙擊預覽最好的體驗，我們本地端自動模擬成功！)
            if (!API_URL || API_URL.includes("YOUR_API")) {
              simulateLocalAction(orderData);
            } else {
              // 若這真的是預期的 GAS 異常且想本地先跑預覽
              simulateLocalAction(orderData);
            }
          } finally {
            setIsSubmitting(false);
          }
        };

        // 本地模擬（離線保險絲）
        const simulateLocalAction = (orderData) => {
          const mockId = editingOrder ? editingOrder.orderId : "local-uuid-" + Math.random().toString(36).substr(2, 9);
          if (editingOrder) {
            setOrders(prev => prev.map(o => o.orderId === mockId ? { ...o, ...orderData, orderId: mockId } : o));
            showToast("✨ (本地試玩模式) 修改成功！", "success");
          } else {
            const newOrder = {
              orderId: mockId,
              timestamp: new Date().toISOString(),
              name: orderData.name,
              drink: orderData.drink,
              sugar: orderData.sugar,
              ice: orderData.ice,
              quantity: orderData.quantity,
              totalPrice: orderData.totalPrice
            };
            setOrders(prev => [newOrder, ...prev]);
            showToast("🎉 (本地試玩模式) 送單成功！", "success");
          }
          setFormState(prev => ({
            ...prev,
            drink: "",
            price: 0,
            category: "",
            quantity: 1,
            toppings: []
          }));
          setEditingOrder(null);
        };

        // 當點擊列表中「編輯點單」時
        const handleEditClick = (order) => {
          // 下滑捲動回表單區
          const element = document.getElementById("order-form-container");
          if (element) {
            element.scrollIntoView({ behavior: "smooth" });
          }

          setEditingOrder(order);

          // 手動剖析飲品與配料 [加 珍珠, 椰果]
          let baseDrink = order.drink;
          let matchedToppings = [];
          
          const toppingMatch = order.drink.match(/(.+) \[(?:加 )?(.+)\]/);
          if (toppingMatch) {
            baseDrink = toppingMatch[1].trim();
            matchedToppings = toppingMatch[2].split(",").map(t => t.trim());
          }

          // 從菜單中找出這款飲料對應的單價
          const matchedMenu = menu.find(m => m.name === baseDrink) || { price: 35, category: "" };

          setFormState({
            name: order.name,
            drink: baseDrink,
            price: matchedMenu.price,
            category: matchedMenu.category,
            sugar: order.sugar,
            ice: order.ice,
            quantity: order.quantity,
            toppings: matchedToppings
          });

          showToast("✏️ 已經將飲料載入上方修改表單", "info");
        };

        // 取消修改
        const handleCancelEdit = () => {
          setEditingOrder(null);
          setFormState(prev => ({
            ...prev,
            drink: "",
            price: 0,
            category: "",
            quantity: 1,
            toppings: []
          }));
          showToast("已重置還原為「新增訂單」狀態", "info");
        };

        // 刪除訂單
        const handleDeleteOrder = async (orderId) => {
          if (!confirm("確定要刪除該筆訂單嗎？這動作無法還原喔！")) return;

          try {
            const payload = {
              action: "delete",
              data: { orderId }
            };

            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (result.status === "success") {
              showToast("🗑️ 訂單已成功移除！", "success");
              await fetchRemoteData(true);
            } else {
              throw new Error(result.message);
            }
          } catch (err) {
            console.error("刪除失敗:", err);
            // 本地端先行刪除(離線保險)
            setOrders(prev => prev.filter(o => o.orderId !== orderId));
            showToast("🗑️ (本地試玩模式) 已移除點單", "success");
          }
        };

        // 點選右側菜單時，自動帶入點購區
        const selectDrinkFromMenu = (menuItem) => {
          setFormState(prev => ({
            ...prev,
            drink: menuItem.name,
            price: menuItem.price,
            category: menuItem.category,
            toppings: [] // 清空配料以便重新選搭
          }));

          // 滾動/動效提醒
          const element = document.getElementById("order-form-container");
          if (element) {
            element.scrollIntoView({ behavior: "smooth" });
          }

          // 表單卡片微微放大再復原的效果
          element.classList.add("ring-4", "ring-emerald-400");
          setTimeout(() => {
            element.classList.remove("ring-4", "ring-emerald-400");
          }, 400);

          showToast(`已選好：${menuItem.name}，可於下方調整甜度冰度配料`, "success");
        };

        // 撈取菜單所有的不重複分類，供作切換 Tab
        const categories = useMemo(() => {
          const set = new Set();
          menu.forEach(item => {
            if (item.category) set.add(item.category);
          });
          return ["全部", ...Array.from(set)];
        }, [menu]);

        // 篩選後要呈現的菜單列表
        const displayedMenu = useMemo(() => {
          return menu.filter(item => {
            const matchesCat = activeTabCategory === "全部" || item.category === activeTabCategory;
            const matchesSearch = !menuSearch || 
              item.name.toLowerCase().includes(menuSearch.toLowerCase()) || 
              (item.description && item.description.toLowerCase().includes(menuSearch.toLowerCase()));
            return matchesCat & matchesSearch;
          });
        }, [menu, activeTabCategory, menuSearch]);

        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 font-sans">
            
            {/* 通知浮動視窗 */}
            {notification && (
              <div className={`fixed top-5 right-5 z-50 px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-x-0 border ${
                notification.type === "success" 
                  ? "bg-emerald-50 border-emerald-300 text-emerald-800"
                  : notification.type === "error"
                  ? "bg-rose-50 border-rose-300 text-rose-800"
                  : notification.type === "warning"
                  ? "bg-amber-50 border-amber-300 text-amber-800"
                  : "bg-blue-50 border-blue-300 text-blue-800"
              }`}>
                <div className="flex-shrink-0">
                  <Icons.Cup className="w-5 h-5 animate-pulse" />
                </div>
                <p className="text-sm font-bold">{notification.msg}</p>
              </div>
            )}

            {/* 精緻頂部大氣 Title banner */}
            <header className="bg-gradient-to-r from-emerald-800 via-teal-900 to-green-950 rounded-3xl p-6 sm:p-10 text-white relative overflow-hidden shadow-soft-lg">
              {/* 背景茶杯水印 */}
              <div className="absolute right-0 bottom-0 top-0 opacity-10 select-none pointer-events-none translate-x-6">
                <Icons.Cup className="w-96 h-96" />
              </div>

              {/* 橫條徽章 */}
              <div className="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 bg-white/10 backdrop-blur-md rounded-full text-xs font-bold text-emerald-200 mb-3 border border-white/10">
                    <span className="flex h-2 w-2 relative">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-300"></span>
                    </span>
                    <span>今日辦公室訂單火熱進行中</span>
                  </div>
                  <h1 className="text-2xl sm:text-4xl font-extrabold tracking-tight flex items-center gap-3">
                    🥤 辦公室飲料訂購系統
                  </h1>
                  <p className="text-xs sm:text-sm text-emerald-100/90 mt-2 font-light">
                    輕鬆揪團不慌亂！即時連線 Google 試算表，自動統計加總，告別繁複手抄計算，迎來愜意午茶時光。
                  </p>
                </div>
                
                {/* 重新載入按鈕 */}
                <button
                  onClick={() => fetchRemoteData()}
                  disabled={apiLoading}
                  className="scale-hover flex items-center gap-2 px-4 py-2.5 bg-white text-emerald-800 text-xs font-bold rounded-xl shadow-gold hover:bg-slate-50 transition active:scale-95 disabled:opacity-50"
                >
                  {apiLoading ? (
                    <>
                      <Icons.Loader className="w-4 h-4 text-emerald-800 animate-spin" />
                      <span>更新資料中...</span>
                    </>
                  ) : (
                    <>
                      <Icons.Refresh />
                      <span>重新整理試算表</span>
                    </>
                  )}
                </button>
              </div>

              {/* 小統計 Bar */}
              <div className="relative z-10 flex gap-4 mt-8 pt-6 border-t border-white/10 text-emerald-100 flex-wrap">
                <div className="text-xs">
                  <span className="opacity-75 block text-[10px]">當前日期</span>
                  <span className="font-bold font-mono">{new Date().toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' })}</span>
                </div>
                <div className="w-px bg-white/10 hidden sm:block"></div>
                <div className="text-xs">
                  <span className="opacity-75 block text-[10px]">後端狀態</span>
                  <span className={`font-bold inline-flex items-center gap-1 ${apiError ? 'text-amber-300' : 'text-emerald-300'}`}>
                    <span className="h-1.5 w-1.5 rounded-full bg-current"></span>
                    {apiError ? '備份伺服模式' : '雲端同步正常'}
                  </span>
                </div>
              </div>
            </header>

            {/* 連線失敗的精緻警告條 */}
            {apiError && (
              <div className="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl text-xs leading-relaxed flex items-start gap-2.5">
                <span className="text-lg">💡</span>
                <div>
                  <p className="font-bold">提醒您：</p>
                  <p>{apiError}</p>
                </div>
              </div>
            )}

            {/* 核心兩欄主佈局 */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* 左邊：飲料訂購 (12分之5) */}
              <section className="lg:col-span-5 space-y-6">
                <OrderForm 
                  formState={formState}
                  setFormState={setFormState}
                  isEditing={!!editingOrder}
                  onCancelEdit={handleCancelEdit}
                  onSubmit={handleFormSubmit}
                  isSubmitting={isSubmitting}
                  lastOrderName={lastOrderName}
                />
              </section>

              {/* 右邊：雲端訂單明細 & 飲料菜單 (12分之7) */}
              <section className="lg:col-span-7 space-y-8">
                
                {/* 1. 今日投單清單列表 */}
                <OrderList 
                  orders={orders}
                  onEdit={handleEditClick}
                  onDelete={handleDeleteOrder}
                  activeUser={lastOrderName}
                  onFilterMyOrders={setIsFilteringMy}
                  isFilteringMy={isFilteringMy}
                  currentFilterUser={lastOrderName}
                />

                {/* 2. 精緻美味飲料菜單 */}
                <div id="menu-section" className="bg-white rounded-2xl border border-slate-100 shadow-soft-lg p-6 space-y-6">
                  
                  {/* 標題與搜尋 */}
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <h3 className="text-lg font-bold text-slate-800 flex items-center gap-1">
                        🍂 精選冷熱飲品
                      </h3>
                      <p className="text-[10px] text-slate-400">
                        點選任何一款飲料卡片，便能將其代入訂購單。
                      </p>
                    </div>
                    
                    {/* 搜尋菜單 */}
                    <div className="relative w-full sm:w-48">
                      <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <Icons.Search />
                      </span>
                      <input
                        type="text"
                        placeholder="搜尋菜單飲料..."
                        value={menuSearch}
                        onChange={(e) => setMenuSearch(e.target.value)}
                        className="w-full pl-8 pr-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-500 text-xs text-slate-600 transition bg-slate-50/50"
                      />
                    </div>
                  </div>

                  {/* 飲料種類 Tabs */}
                  {categories.length > 1 && (
                    <div className="flex gap-1.5 overflow-x-auto pb-1 max-w-full">
                      {categories.map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setActiveTabCategory(cat)}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                            activeTabCategory === cat
                              ? 'bg-brand-600 text-white shadow-soft-lg'
                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  )}

                  {/* 菜單卡片清單網格 */}
                  {displayedMenu.length === 0 ? (
                    <div className="text-center py-10 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-slate-400">
                      <p className="text-xs">找不到此分類或符合搜尋的飲料項目 🍂</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {displayedMenu.map((item) => {
                        const isSelectedInForm = formState.drink === item.name;
                        return (
                          <div
                            key={item.name}
                            onClick={() => selectDrinkFromMenu(item)}
                            className={`p-4 rounded-2xl border text-left cursor-pointer transition-all scale-hover relative overflow-hidden group ${
                              isSelectedInForm
                                ? 'bg-brand-50 border-brand-500 shadow-[0_4px_16px_rgba(16,185,129,0.12)]'
                                : 'bg-white border-slate-100 hover:border-slate-200 hover:shadow-soft-lg'
                            }`}
                          >
                            <div className="flex justify-between items-start mb-1">
                              <h4 className="text-sm font-bold text-slate-900 group-hover:text-brand-700 transition">
                                {item.name}
                              </h4>
                              <span className="text-sm font-bold text-emerald-600 font-mono">
                                ${item.price}
                              </span>
                            </div>
                            
                            {item.category && (
                              <span className="inline-block text-[9px] font-bold text-emerald-800 bg-emerald-100 px-1.5 py-0.5 rounded mb-1.5">
                                {item.category}
                              </span>
                            )}
                            
                            {item.description && (
                              <p className="text-[11px] text-slate-400 leading-normal line-clamp-2">
                                {item.description}
                              </p>
                            )}

                            {/* 點選指示遮罩 hover 效果 */}
                            <div className="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition duration-200">
                              <span className="text-[9px] font-bold bg-brand-600 text-white px-2 py-0.5 rounded-lg shadow-sm">
                                點擊點餐 ➔
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                </div>

              </section>

            </div>

            {/* 回饋底欄 */}
            <footer className="text-center py-6 text-[11px] text-slate-400 border-t border-slate-200/50">
              <p>🥤 辦公室飲料集體訂購系統 - 舒適工作日小伴侶</p>
              <p className="mt-1 font-mono">Powered by React, Tailwind CSS and Google Apps Script • UTC Date: 2026-05-28</p>
            </footer>

          </div>
        );
      }

      // 掛載至 ROOT
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>

  </body>
</html>
